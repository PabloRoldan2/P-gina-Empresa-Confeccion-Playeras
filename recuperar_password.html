<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Textilería GT - Recuperar Contraseña</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --dark-blue: #001a3d;
            --light-grey: #f4f4f4;
            --link-blue: #0000ee;
            --pink-accent: #ffc0cb;
            --white: #ffffff;
        }

        body, html {
            height: 100%;
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .recovery-container {
            background: var(--white);
            width: 100%;
            max-width: 400px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            text-align: center;
        }

        .icon-box {
            width: 80px;
            height: 80px;
            background-color: var(--pink-accent);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 20px;
        }

        h2 {
            color: var(--dark-blue);
            margin-bottom: 10px;
            font-size: 1.6rem;
        }

        p {
            color: #64748b;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--dark-blue);
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background-color: var(--light-grey);
            border: 2px solid transparent;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s;
        }

        .input-group input:focus {
            border-color: var(--pink-accent);
            background-color: white;
        }

        .btn-reset {
            width: 100%;
            padding: 14px;
            background-color: var(--dark-blue);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-reset:hover {
            background-color: #002b66;
        }

        .back-to-login {
            display: inline-block;
            margin-top: 20px;
            color: var(--link-blue);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .back-to-login:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="recovery-container">
        <div class="icon-box">
            <i class="fas fa-lock-open"></i>
        </div>
        
        <h2>¿Problemas para entrar?</h2>
        <p>Ingresa tu correo electrónico y te enviaremos un enlace para que recuperes el acceso a tu cuenta de Textilería GT.</p>

        <form id="recoveryForm">
            <div class="input-group">
                <label>Correo electrónico</label>
                <input type="email" id="emailInput" required placeholder="tu-correo@ejemplo.com">
            </div>

            <button type="submit" class="btn-reset">Enviar enlace</button>
        </form>

        <a href="Login.html" class="back-to-login">
            <i class="fas fa-chevron-left" style="font-size: 0.8rem;"></i> Volver al inicio de sesión
        </a>
    </div>

    <script>
        document.getElementById('recoveryForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('emailInput').value;

            // Simulación de envío
            alert("Se han enviado las instrucciones de recuperación a: " + email);
            
            // Redirigimos al Login después de "enviar"
            window.location.href = "Login.html";
        });
    </script>
</body>
</html>
