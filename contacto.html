<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Textilería GT - Contacto</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --dark-blue: #001a3d;
            --light-blue: #f0f4f8;
            --pink-placeholder: #ffc0cb;
            --white: #ffffff;
            --gris-input: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            color: var(--dark-blue);
            background-color: var(--white);
        }

        /* --- ENCABEZADO (Igual al Index) --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 5%;
            background: white;
            border-bottom: 1px solid #eee;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Estilo para los logos e imágenes del header */
        .logo-img {
            height: 30px;
            width: auto;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 20px;
            margin: 0;
            padding: 0;
        }

        nav a {
            text-decoration: none;
            color: var(--dark-blue);
            font-weight: 500;
        }

        nav a.active {
            border-bottom: 2px solid var(--dark-blue);
        }

        .login-btn {
            background: var(--dark-blue);
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
        }

        /* --- CONTENIDO DE CONTACTO --- */
        .main-content {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 60px 8%;
            gap: 60px;
        }

        .form-container {
            flex: 1.2;
        }

        .form-container h2 {
            font-size: 32px;
            margin: 0 0 10px 0;
        }

        .form-container p {
            font-size: 15px;
            margin-bottom: 35px;
            color: #444;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .full-row {
            grid-column: span 2;
        }

        label {
            font-weight: 600;
            font-size: 14px;
        }

        input, textarea {
            background-color: var(--gris-input);
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 14px;
            outline: none;
            font-family: inherit;
        }

        textarea {
            height: 120px;
            resize: none;
        }

        .btn-enviar {
            background-color: var(--dark-blue);
            color: var(--white);
            border: none;
            padding: 14px 70px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 25px;
            margin: 20px;
        }

        /* --- ILUSTRACIÓN --- */
        .illustration-container {
            flex: 0.8;
            display: flex;
            justify-content: center;
        }

        .img-sobre {
            width: 100%;
            max-width: 400px;
            height: auto;
        }

        /* --- FOOTER --- */
        footer {
            background: var(--dark-blue);
            color: white;
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
        }

        .social-icons {
            display: flex;
            gap: 15px;
            font-size: 1.2rem;
        }

        .social-icons i { cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="imagenes/logo.png" style="width: 60px; height: 60px; ">
            <h2 style="margin:0">Textilería GT</h2>
            <img src="imagenes/bandera.png" style="width: 50px; height: 40px;">
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="mision.html">Misión</a></li>
                <li><a href="vision.html">Visión</a></li>
                <li><a href="contacto.html" class="active">Contacto</a></li>
            </ul>
        </nav>
        <a href="login.html" class="login-btn">
            <i class="fas fa-sign-in-alt"></i> Iniciar sesión
        </a>
    </header>

    <main class="main-content">
        <section class="form-container">
            <h2>Contáctanos</h2>
            <p>Para obtener más información o asistencia sobre nuestros productos.</p>
            
            <form>
                <div class="form-grid">
                    <div class="field-group">
                        <label>Nombre*</label>
                        <input type="text" required>
                    </div>
                    <div class="field-group">
                        <label>Apellidos*</label>
                        <input type="text" required>
                    </div>
                    <div class="field-group">
                        <label>Correo*</label>
                        <input type="email" required>
                    </div>
                    <div class="field-group">
                        <label>Teléfono*</label>
                        <input type="tel">
                    </div>
                    <div class="field-group full-row">
                        <label>Motivo de contacto*</label>
                        <textarea required></textarea>
                    </div>
                </div>
                <button type="submit" class="btn-enviar">Enviar</button>
            </form>
        </section>

        <section class="illustration-container">
            <img src="imagenes/sobre.png" alt="Contacto" class="img-sobre">
        </section>
    </main>

    <footer>
        <div>© 2026 Textilería GT. Todos los derechos reservados</div>
        <div style="display: flex; align-items: center; gap: 20px;">
            <span>Síguenos en</span>
            <div class="social-icons">
                <i class="fab fa-instagram"></i>
                <i class="fab fa-facebook-f"></i>
                <i class="fab fa-x-twitter"></i>
            </div>
        </div>
    </footer>

</body>
</html>
