<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Textilería GT - Inicio de sesión</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --dark-blue: #001a3d;
            --light-grey: #e0e0e0;
            --link-blue: #0000ee;
            --error-red: #d32f2f;
            --pink-placeholder: #ffc0cb;
        }

        body, html { height: 100%; margin: 0; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        .login-container { display: flex; height: 100vh; width: 100vw; }

        .image-side {
            flex: 1;
            background-color: var(--pink-placeholder);
            padding: 40px;
            display: flex;
            align-items: flex-start;
        }

        .image-side h1 { 
            color: white; 
            font-size: 3rem; 
            margin: 0;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.1); 
            max-width: 400px;
            line-height: 1.1;
        }

        .form-side { 
            width: 450px; 
            background: white; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            padding: 0 60px; 
            position: relative; 
        }

        .form-side h2 { color: var(--dark-blue); font-size: 2.2rem; text-align: center; margin-bottom: 30px; }

        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: 600; }
        .input-group input { 
            width: 100%; padding: 15px; background-color: var(--light-grey); 
            border: 2px solid transparent; border-radius: 25px; box-sizing: border-box; outline: none; 
        }

        .input-group input.error-border { border-color: var(--error-red); background-color: #ffebee; }

        #error-message {
            color: var(--error-red);
            font-size: 0.85rem;
            margin-bottom: 15px;
            display: none; 
            text-align: center;
            font-weight: bold;
        }

        .btn-access {
            width: 100%; padding: 15px; background-color: var(--dark-blue); color: white;
            border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }

        .forgot-pass {
            display: block;
            margin-top: 15px;
            color: var(--link-blue);
            text-decoration: underline;
            font-size: 0.9rem;
        }

        .back-home { 
            position: absolute; 
            bottom: 30px; 
            left: 60px; 
            color: var(--link-blue); 
            text-decoration: none; 
            font-weight: 600; 
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="image-side">
            <h1>Diseños que nos representan</h1>
        </div>

        <div class="form-side">
            <h2>Inicio de sesión</h2>
            
            <div id="error-message">¡Usuario o contraseña incorrectos!</div>

            <form id="loginForm">
                <div class="input-group">
                    <label>Usuario*</label>
                    <input type="text" id="userInput" required placeholder="Usuario">
                </div>

                <div class="input-group">
                    <label>Contraseña*</label>
                    <input type="password" id="passInput" required placeholder="Contraseña">
                </div>

                <button type="submit" class="btn-access">
                    <i class="fas fa-sign-in-alt"></i> Acceder
                </button>

                <a href="recuperar_password.html" class="forgot-pass">Olvidé mi contraseña</a>
            </form>

            <a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> Volver al Inicio</a>
        </div>
    </div>

    <script>
        const USER_VALIDO = "admin";
        const PASS_VALIDA = "1234";

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const user = document.getElementById('userInput').value;
            const pass = document.getElementById('passInput').value;
            const errorMsg = document.getElementById('error-message');
            const inputs = document.querySelectorAll('input');

            if (user === USER_VALIDO && pass === PASS_VALIDA) {
                window.location.href = "menuprincipal.html"; 
            } else {
                errorMsg.style.display = "block";
                inputs.forEach(input => input.classList.add('error-border'));
                document.getElementById('passInput').value = "";
            }
        });

        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', () => {
                document.getElementById('error-message').style.display = "none";
                input.classList.remove('error-border');
            });
        });
    </script>
</body>
</html>
