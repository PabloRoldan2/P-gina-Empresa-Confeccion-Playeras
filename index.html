<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Página Web</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
        }

        header{
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav{
            background-color: #34495e;
            padding: 10px;
            text-align: center;
        }

        nav a{
            color: white;
            text-decoration: none;
            margin: 0 15px;
        }

        section{
            padding: 20px;
        }

        .card{
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        footer{
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Bienvenido a Mi Página</h1>
        <p>Ejemplo básico en HTML y CSS</p>
    </header>

    <nav>
        <a href="#">Inicio</a>
        <a href="#">Servicios</a>
        <a href="#">Contacto</a>
    </nav>

    <section>
        <div class="card">
            <h2>Sobre Nosotros</h2>
            <p>
                Esta es una página web sencilla creada con HTML y CSS.
                Puedes modificar colores, textos y diseños fácilmente.
            </p>

            <button>Leer más</button>
        </div>
    </section>

    <footer>
        <p>© 2026 Mi Página Web</p>
    </footer>

</body>
</html>
