<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Página Web</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
        }

        header{
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav{
            background-color: #34495e;
            padding: 10px;
            text-align: center;
        }

        nav button{
            background: none;
            border: none;
            color: white;
            font-size: 16px;
            margin: 0 15px;
            cursor: pointer;
        }

        nav button:hover{
            color: #f1c40f;
        }

        section{
            padding: 20px;
        }

        .card{
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        button.leer{
            padding: 10px 15px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button.leer:hover{
            background-color: #2980b9;
        }

        footer{
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Bienvenido a Mi Página</h1>
        <p>Ejemplo básico en HTML, CSS y JavaScript</p>
    </header>

    <nav>
        <button onclick="mostrarInicio()">Inicio</button>
        <button onclick="mostrarServicios()">Servicios</button>
        <button onclick="mostrarContacto()">Contacto</button>
    </nav>

    <section>
        <div class="card">
            <h2 id="titulo">Inicio</h2>

            <p id="contenido">
                Bienvenido a nuestra página web. Aquí encontrarás
                información sobre nuestros servicios y formas de contacto.
            </p>

            <button class="leer" onclick="leerMas()">
                Leer más
            </button>
        </div>
    </section>

    <footer>
        <p>© 2026 Mi Página Web</p>
    </footer>

    <script>

        function mostrarInicio(){
            document.getElementById("titulo").innerHTML = "Inicio";

            document.getElementById("contenido").innerHTML =
            "Bienvenido a nuestra página principal. Somos una empresa dedicada al desarrollo de software y diseño web.";
        }

        function mostrarServicios(){
            document.getElementById("titulo").innerHTML = "Servicios";

            document.getElementById("contenido").innerHTML =
            "Ofrecemos desarrollo de páginas web, aplicaciones de escritorio, bases de datos y soporte técnico.";
        }

        function mostrarContacto(){
            document.getElementById("titulo").innerHTML = "Contacto";

            document.getElementById("contenido").innerHTML =
            "Puedes contactarnos al correo ejemplo@gmail.com o al teléfono 5555-5555.";
        }

        function leerMas(){
            alert("Gracias por visitar nuestra página. Próximamente tendremos más contenido disponible.");
        }

    </script>

</body>
</html>
